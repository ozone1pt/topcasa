name: APK Android

on:
  push:
    paths:
      - 'mobile/**'
      - '.github/workflows/android-apk.yml'
  pull_request:
    paths:
      - 'mobile/**'
      - '.github/workflows/android-apk.yml'

jobs:
  release-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Dependências
        run: flutter pub get

      - name: Analisar
        run: flutter analyze

      # Release assinado com a chave de debug (não há keystore de loja).
      # --split-per-abi produz um APK por arquitetura (~19 MB no arm64),
      # em vez do APK de debug universal (~160 MB).
      - name: APK de release por ABI
        run: flutter build apk --release --split-per-abi --dart-define=API_BASE_URL=https://staging.topcasa.pt/api/v1

      - uses: actions/upload-artifact@v4
        with:
          name: topcasa-release-apk
          path: mobile/build/app/outputs/flutter-apk/*-release.apk
          if-no-files-found: error
          retention-days: 14
