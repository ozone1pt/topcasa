name: APK Android

on:
  push:
    paths:
      - 'mobile/**'
      - '.github/workflows/android-apk.yml'
  pull_request:
    paths:
      - 'mobile/**'
      - '.github/workflows/android-apk.yml'

jobs:
  debug-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Dependências
        run: flutter pub get

      - name: Analisar
        run: flutter analyze

      - name: APK de debug
        run: flutter build apk --debug --dart-define=API_BASE_URL=https://staging.topcasa.pt/api/v1

      - uses: actions/upload-artifact@v4
        with:
          name: topcasa-debug-apk
          path: mobile/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14
